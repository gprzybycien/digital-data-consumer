      value: proposed
    - property: informationRole
      value: as_of
  - name: country
    businessName: region
    logicalType: string
    required: true
    description: limit to EU customers
    customProperties:
    - property: requirementSource
      value: proposed
    - property: informationRole
      value: eligibility
    - property: openQuestion
      value: Business meaning to agree; no governed term was found for "EU region".
  - name: marketing_opt_in
    businessName: opt in
    logicalType: boolean
    required: true
    description: ensure customers have opted in to marketing email
    customProperties:
    - property: requirementSource
      value: proposed
    - property: informationRole
      value: eligibility
    - property: openQuestion
      value: Business meaning to agree; no governed term was found for "marketing consent".
  - name: email_invite_sent
