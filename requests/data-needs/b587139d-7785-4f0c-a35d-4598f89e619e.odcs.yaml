      value: proposed
    - property: informationRole
      value: activation
  - name: review_note
    businessName: review explanation
    logicalType: string
    required: true
    description: notes why a row was selected for review
    customProperties:
    - property: requirementSource
      value: proposed
    - property: informationRole
      value: explanation
  quality:
  - type: text
    description: 'Rule: region — limit to EU customers'
    customProperties:
    - property: requirementSource
      value: proposed
  - type: text
    description: 'Rule: opt in — ensure customers have opted in to marketing email'
    customProperties:
    - property: requirementSource
      value: proposed
  - type: text
