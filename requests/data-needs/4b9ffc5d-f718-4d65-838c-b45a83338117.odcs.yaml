customProperties:
- property: consumerRequest
  value:
    originalText: We are launching Voyager Plus, an annual travel membership, in March. Which existing
      customers are most likely to buy it within 30 days of an email invitation, so we can invite the
      best 50,000 first? Existing travel-booking customers in the EU who opted in to marketing email.
      Marketing reviews a ranked shortlist before sending.
    industry: Knowledge Accelerator for Cross Industry
    deliveryOutcome: structured
    openQuestions:
    - 'Not stated yet: who it is for'
    - 'Not stated yet: time window'
    - 'Not stated yet: how often results are needed'
    - 'Glossary note on Propensity To Buy Product — Event distinction: Purchase probability is a different
      outcome from lapse, cancellation, renewal, response or claim probability. Those measures must not
      be substituted without confirming that their defined event matches the request.'
    - 'Glossary note on Propensity To Buy Product — Context to clarify when relevant and not already provided:
      the product and precise purchase event; population and eligibility; prediction horizon and effective
      or score date; whether an existing score or new analysis is wanted; score representation; intended
      action and permitted use.'
    bindingStatus: unbound
