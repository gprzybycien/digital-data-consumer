apiVersion: v3.1.0
kind: DataContract
id: 45b69eae-6f1b-4c33-9162-2ab64abb0363
name: Identify the top 50,000 EU travel‑booking customers most likely to purchase Voyager Plus…
version: 0.1.0
status: draft
description:
  purpose: Identify the top 50,000 EU travel‑booking customers most likely to purchase Voyager Plus within
    30 days of an email invitation.
  usage: marketing reviews ranked shortlist before sending
  limitations: Requirements draft. Sources, bindings and any existing assets are not yet checked.
schema:
- name: voyager_plus_purchase_likelihood_shortlist
  businessName: Voyager Plus purchase likelihood shortlist
  logicalType: object
  dataGranularityDescription: One row per eligible customer
  properties:
  - name: customer_id
    businessName: Customer ID
    logicalType: string
    required: true
    description: unique customer identifier
    authoritativeDefinitions:
    - type: businessDefinition
      url: https://dataplatform.cloud.ibm.com/governance/terms/f95259e1-bcb6-43cb-9e86-dd467600ca11/f400c111-9099-461e-871e-c2f291ac963b_12?context=df
      description: Customer (Knowledge Accelerator for Cross Industry)
    customProperties:
    - property: requirementSource
      value: glossary
    - property: informationRole
      value: identifier
  - name: likelihood_score
    businessName: Likelihood Score
    logicalType: number
    required: true
    description: predicted purchase likelihood
    authoritativeDefinitions:
    - type: businessDefinition
      url: https://dataplatform.cloud.ibm.com/governance/terms/8a1338ad-b5b7-46bf-8cf8-6d526c07734e/06b76afc-147a-43ea-a1b8-ae5b4144721b_12?context=df
      description: Propensity To Buy Product (Knowledge Accelerator for Cross Industry)
    customProperties:
    - property: requirementSource
      value: glossary
    - property: informationRole
      value: outcome
  - name: rank
    businessName: Rank
    logicalType: integer
    required: true
    description: order of customers by likelihood
    customProperties:
    - property: requirementSource
      value: proposed
    - property: informationRole
      value: rank
  - name: region
    businessName: Region
    logicalType: string
    required: true
    description: EU residency verification
    authoritativeDefinitions:
    - type: businessDefinition
      url: https://dataplatform.cloud.ibm.com/governance/terms/560d17da-2df3-4c8a-90c9-1c1e45099f99/b96b37be-3855-4309-afbe-24925b51ed92_10?context=df
      description: Region Name (Knowledge Accelerator for Cross Industry)
    customProperties:
    - property: requirementSource
      value: glossary
    - property: informationRole
      value: eligibility
  - name: marketing_opt_in
    businessName: Marketing Opt In
    logicalType: boolean
    required: true
    description: whether the customer has opted in to marketing email
    customProperties:
    - property: requirementSource
      value: proposed
    - property: informationRole
      value: eligibility
    - property: openQuestion
      value: Business meaning to agree; no governed term was found for "marketing consent".
  - name: invitation_date
    businessName: Invitation Date
    logicalType: date
    required: true
    description: date of email invitation
    customProperties:
    - property: requirementSource
      value: proposed
    - property: informationRole
      value: as_of
  - name: explanation
    businessName: Explanation
    logicalType: string
    required: true
    description: why the likelihood score was assigned
    customProperties:
    - property: requirementSource
      value: proposed
    - property: informationRole
      value: explanation
  - name: activation
    businessName: Activation
    logicalType: string
    required: true
    description: action needed to invite the customer
    customProperties:
    - property: requirementSource
      value: proposed
    - property: informationRole
      value: activation
  quality:
  - type: text
    description: 'Rule: Region — EU residency verification'
    customProperties:
    - property: requirementSource
      value: proposed
  - type: text
    description: 'Rule: Marketing Opt In — whether the customer has opted in to marketing email'
    customProperties:
    - property: requirementSource
      value: proposed
  - type: text
    description: 'Volume: 50,000 customers'
    customProperties:
    - property: requirementSource
      value: typed
slaProperties:
- property: predictionHorizon
  value: 30
  unit: d
- property: frequency
  value: open
customProperties:
- property: consumerRequest
  value:
    originalText: We are launching Voyager Plus, an annual travel membership, in March. Which existing
      customers are most likely to buy it within 30 days of an email invitation, so we can invite the
      best 50,000 first? Existing travel-booking customers in the EU who opted in to marketing email.
      Marketing reviews a ranked shortlist before sending.
    industry: Knowledge Accelerator for Cross Industry
    deliveryOutcome: structured
    openQuestions:
    - 'Not stated yet: how often results are needed'
    - 'Glossary note on Propensity To Buy Product — Event distinction: Purchase probability is a different
      outcome from lapse, cancellation, renewal, response or claim probability. Those measures must not
      be substituted without confirming that their defined event matches the request.'
    - 'Glossary note on Propensity To Buy Product — Context to clarify when relevant and not already provided:
      the product and precise purchase event; population and eligibility; prediction horizon and effective
      or score date; whether an existing score or new analysis is wanted; score representation; intended
      action and permitted use.'
    bindingStatus: unbound
