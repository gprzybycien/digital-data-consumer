apiVersion: v3.1.0
kind: DataContract
id: 0fa35705-944c-47d2-8039-4ad26c87b558
name: Identify the top 50,000 existing EU travel‑booking customers most likely to purchase…
version: 0.1.0
status: draft
description:
  purpose: Identify the top 50,000 existing EU travel‑booking customers most likely to purchase Voyager
    Plus within 30 days of an email invitation.
  usage: marketing reviews the ranked shortlist before sending
  limitations: Requirements draft. Sources, bindings and any existing assets are not yet checked.
schema:
- name: requested_information
  businessName: Requested information
  logicalType: object
  dataGranularityDescription: To agree with the engineer
  properties:
  - name: customer_id
    businessName: customer
    logicalType: string
    required: true
    description: unique identifier for each customer
    authoritativeDefinitions:
    - type: businessDefinition
      url: https://dataplatform.cloud.ibm.com/governance/terms/f95259e1-bcb6-43cb-9e86-dd467600ca11/f400c111-9099-461e-871e-c2f291ac963b_12?context=df
      description: Customer (Knowledge Accelerator for Cross Industry)
    customProperties:
    - property: requirementSource
      value: glossary
    - property: informationRole
      value: identifier
  - name: purchase_likelihood
    businessName: likelihood score
    logicalType: number
    required: true
    description: predicted probability of buying Voyager Plus
    authoritativeDefinitions:
    - type: businessDefinition
      url: https://dataplatform.cloud.ibm.com/governance/terms/8a1338ad-b5b7-46bf-8cf8-6d526c07734e/06b76afc-147a-43ea-a1b8-ae5b4144721b_12?context=df
      description: Propensity To Buy Product (Knowledge Accelerator for Cross Industry)
    customProperties:
    - property: requirementSource
      value: glossary
    - property: informationRole
      value: outcome
  - name: selection_reason
    businessName: selection reason
    logicalType: string
    required: true
