    logicalType: date
    required: true
    description: date of the likelihood prediction
    customProperties:
    - property: requirementSource
      value: proposed
    - property: informationRole
      value: as_of
  - name: region
    businessName: region
    logicalType: string
    required: true
    description: EU customers only
    authoritativeDefinitions:
    - type: businessDefinition
      url: https://dataplatform.cloud.ibm.com/governance/terms/560d17da-2df3-4c8a-90c9-1c1e45099f99/b96b37be-3855-4309-afbe-24925b51ed92_10?context=df
      description: Region Name (Knowledge Accelerator for Cross Industry)
    customProperties:
    - property: requirementSource
      value: glossary
    - property: informationRole
      value: eligibility
  - name: email_opt_in
    businessName: marketing opt in
    logicalType: boolean
    required: true
    description: customers who have opted in to marketing emails
    customProperties:
    - property: requirementSource
      value: proposed
    - property: informationRole
      value: eligibility
  - name: email_invitation_sent
    businessName: invitation
    logicalType: boolean
    required: true
    description: flag indicating invitation was sent
    customProperties:
    - property: requirementSource
      value: proposed
    - property: informationRole
      value: activation
  - name: review_status
    businessName: review
