<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>watsonx data consumer agent</title>

    <style>
      :root {
        font-family: "IBM Plex Sans", Inter, Arial, sans-serif;
        color: #161616;
        background: #ffffff;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .site-header {
        z-index: 10;
        display: flex;
        flex: 0 0 64px;
        align-items: center;
        padding: 0 24px;
        color: #ffffff;
        background: #161616;
        border-bottom: 1px solid #393939;
      }

      .site-header__title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      #root {
        position: relative;
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        overflow: hidden;
      }

      .load-error {
        display: grid;
        height: 100%;
        place-items: center;
        padding: 24px;
        color: #da1e28;
        text-align: center;
      }

      @media (max-width: 600px) {
        .site-header { flex-basis: 56px; padding: 0 16px; }
        .site-header__title { font-size: 1rem; }
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <h1 class="site-header__title">watsonx data consumer agent</h1>
    </header>

    <main id="root" aria-label="watsonx data consumer agent chat"></main>

    <script>
      // Context belongs to one run in WxO. Carry only this workflow's state;
      // preserve its exact bytes and restore it from the user's own chat history.
      function createDataNeedContextBridge() {
        const key = "consumer_data_need";
        const historyKey = "consumer_need_context";
        const lastMessageKey = "consumer_last_message";
        let carried;
        let recent = [];
        let collecting = false;
        const recentByThread = new Map();
        let activeThread;
        const byThread = new Map();

        function threadId(message) {
          return message?.thread_id || message?.threadId;
        }

        function remember(value, thread) {
          if (typeof value !== "string" || !value) return;
          carried = value;
          if (thread) {
            activeThread = thread;
            byThread.set(thread, value);
          }
        }

        function receive(event) {
          const message = event.message;
          const value = message?.context?.[key];
          if (typeof value !== "string" || !value) return;
          remember(value, threadId(message));
          const witnessed = message?.context?.consumer_recent_messages;
          if (typeof witnessed === 'string') {
            try { recent = JSON.parse(witnessed); collecting = true; } catch (_) { /* Ignore malformed context. */ }
          }
          if (threadId(message) && collecting) recentByThread.set(threadId(message), recent.slice());
          // This uses the existing conversation metadata, not browser storage.
          message.message_state = {
            ...message.message_state,
            user_defined: {
              ...message.message_state?.user_defined,
              [historyKey]: { value, recent: collecting ? recent.slice() : undefined, received_at: Date.now() }
            }
          };
          event.saveUpdate = true;
        }

        function userText(message) {
          // The typed text, whichever shape the chat client uses.
          const parts = [message?.input?.text, message?.message?.content, message?.content];
          for (const part of parts) {
            if (typeof part === "string" && part.trim()) return part;
            if (Array.isArray(part)) {
              const text = part.map(p => (typeof p === "string" ? p : p?.text || "")).join("");
              if (text.trim()) return text;
            }
          }
          return undefined;
        }

        function send(event) {
          const message = event.message;
          if (!message) return;
          // The user's exact words, so tools need not rely on the model copying them.
          const typed = userText(message);
          if (typed) message.context = { ...message.context, [lastMessageKey]: typed };
          const thread = threadId(message);
          if (typed && /^Help me describe a new data need\b/i.test(typed)) {
            recent = []; collecting = true;
          } else if (typed) {
            if (thread && recentByThread.has(thread)) { recent = recentByThread.get(thread).slice(); collecting = true; }
            else if (activeThread && thread !== activeThread) { recent = []; collecting = false; }
            if (collecting) recent = recent.concat([typed]).slice(-5);
          }
          if (collecting && (!activeThread || thread === activeThread || (typed && /^Help me describe a new data need\b/i.test(typed)))) {
            message.context = { ...message.context, consumer_recent_messages: JSON.stringify(recent) };
            if (thread) recentByThread.set(thread, recent.slice());
          }
          // Context tied to a thread never leaks into a new chat, whose first
          // message has no thread ID yet. Unthreaded context is still carried.
          const value = thread && byThread.has(thread)
            ? byThread.get(thread)
            : (!activeThread ? carried : undefined);
          if (typeof value === "string") {
            // A newer context supplied by a native form callback takes priority.
            message.context = { [key]: value, ...message.context };
            remember(message.context[key], thread);
          }
        }

        function loadThread(event) {
          recent = []; collecting = false;
          carried = undefined;
          activeThread = undefined;
          let latest;
          for (const message of event.messages || []) {
            const saved = message.message_state?.user_defined?.[historyKey];
            if (saved?.value && (!latest || saved.received_at >= latest.received_at)) {
              latest = { ...saved, thread: threadId(message) };
            }
          }
          if (latest) {
            remember(latest.value, latest.thread);
            recent = latest.recent || []; collecting = Array.isArray(latest.recent);
            if (latest.thread && collecting) recentByThread.set(latest.thread, recent.slice());
          }
          else {
            // Older conversations may already expose the original context.
            for (const message of event.messages || []) {
              remember(message.context?.[key], threadId(message));
            }
          }
        }

        function restart() {
          carried = undefined;
          activeThread = undefined;
          byThread.clear();
          recent = []; collecting = false; recentByThread.clear();
        }

        return { receive, send, loadThread, restart };
      }

      function onConsumerChatLoad(instance) {
        const bridge = createDataNeedContextBridge();
        instance.on("pre:receive", bridge.receive);
        instance.on("pre:send", bridge.send);
        instance.on("pre:threadLoaded", bridge.loadThread);
        instance.on("pre:restartConversation", bridge.restart);
      }

      window.wxOConfiguration = {
        orchestrationID: "1002447ca6584c1dbe6bdc052bdb0799_892e96ab-be74-487f-ac30-15756aa4ab42",
        hostURL: "https://au-syd.watson-orchestrate.cloud.ibm.com",
        rootElementID: "root",
        showLauncher: false,
        deploymentPlatform: "ibmcloud",
        crn: "crn:v1:bluemix:public:watsonx-orchestrate:au-syd:a/1002447ca6584c1dbe6bdc052bdb0799:892e96ab-be74-487f-ac30-15756aa4ab42::",

        chatOptions: {
          agentId: "0d02a64e-d250-45ff-9c67-23c1e1cd31a9",
          agentEnvironmentId: "3526f233-4edd-4be7-aee8-07d88d8cb81e",
          onLoad: onConsumerChatLoad
        },

        layout: {
          form: "fullscreen-overlay",
          showOrchestrateHeader: true,
          showMaxWidth: true
        },

        features: {
          showThreadList: true,
          showAgentMemory: false
        },

        header: {
          showResetButton: true,
          showAiDisclaimer: true,
          showMaximize: false,
          showAgentAvatar: true,
          showAgentName: true
        },

        style: {
          theme: "light",
          headerColor: "#161616",
          primaryColor: "#0f62fe",
          userMessageBackgroundColor: "#0f62fe",
          fontFamily: '"IBM Plex Sans", Inter, Arial, sans-serif',
          showBackgroundGradient: false
        }
      };

      setTimeout(function loadWatsonxOrchestrateChat() {
        const script = document.createElement("script");
        script.src = `${window.wxOConfiguration.hostURL}/wxochat/wxoLoader.js?embed=true`;
        script.async = true;

        script.addEventListener("load", function () {
          window.wxoLoader.init();
        });

        script.addEventListener("error", function () {
          document.getElementById("root").innerHTML =
            '<div class="load-error" role="alert">The chat could not be loaded. Please refresh the page or try again later.</div>';
        });

        document.head.appendChild(script);
      }, 0);
    </script>
  </body>
</html>
